server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: picture-backend
  # 默认激活本地开发环境配置（application-local-dev.yml）
  profiles:
    active: local-dev
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_photo_community
    username: root
    password: ${MYSQL_PASSWORD:root}
  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # Session 配置
  session:
    store-type: redis
    # session 30 天后过期
    timeout: 2592000
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: smart_photo_community
      smart_photo_community:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/smart_photo_community
        username: root
        password: ${MYSQL_PASSWORD:root}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: smart_photo_community.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.picture_backend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.picture_backend.controller
## 对象存储配置（完整运行必须从腾讯云获取真实配置）
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:local-dev}
    secretKey: ${COS_SECRET_KEY:local-dev}
    region: ${COS_REGION:local-dev}
    bucket: ${COS_BUCKET:local-dev}

## 阿里云 AI 配置（可选；留空时不影响本地摄影 AI 工作台启动）
aliYunAi:
  apiKey: ''
