server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: picture-backend
  # 默认激活本地开发环境配置（application-local-dev.yml）
  profiles:
    active: local-dev
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_photo_community
    username: root
    password: ${MYSQL_PASSWORD:root}
  # Redis 配置（Spring Boot 3 起统一为 spring.data.redis）
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5000
  # Session 配置（仅引入 spring-session-data-redis，类型自动判定）
  session:
    timeout: 2592000
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # Spring AI（阿里云百炼 DashScope）
  # 把 DASHSCOPE_API_KEY 环境变量或这里的 api-key 换成真实密钥即可启用大模型；
  # 保留占位值时 AI 助手自动使用本地检索式生成（不编造、可完整演示）。
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:not-configured}
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档（springdoc-openapi）：/api/swagger-ui/index.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: com.picture_backend.controller
## AI 助手开关：auto（有密钥用大模型，否则本地模板）/ local / spring-ai
ai:
  chat:
    provider: auto
    maxContextItems: 8
    timeoutMs: 60000
## 对象存储配置（完整运行必须从腾讯云获取真实配置）
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:local-dev}
    secretKey: ${COS_SECRET_KEY:local-dev}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:local-dev}

## 阿里云百炼扩图配置（可选；留空时不影响启动）
aliYunAi:
  apiKey: ''
